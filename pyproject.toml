[project]
name = "mask-off"
version = "0.1.0"
description = "MASK-OFF: generation and evaluation pipeline for material-fact omission benchmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.23.13",
    "polars>=1.42.1",
    "pydantic>=2.13.0",
    "pyyaml",
    "rich",
    "openai>=2.40.0",
    "anthropic>=0.96.0",
    "google-genai>=1.69.0",
    "python-dotenv",
]

[dependency-groups]
dev = [
    # AGENTS.md and README tell every reader to verify with
    # `uv run python -m pytest`. Undeclared, pytest lived in the venv only
    # until the next `uv sync --dev`, which pruned it and made the documented
    # verification command fail with "No module named pytest".
    "pytest>=8",
    "pytest-subtests>=0.14",
    "numpy>=2",  # test_seed_diversity.py imports it at module scope
    "altair>=6.2.2",
    "mcp>=1",
    "openai>=2.44.0",
    "python-lsp-ruff>=2.3.1",
    "python-lsp-server>=1.14.0",
    "websockets>=16.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]
